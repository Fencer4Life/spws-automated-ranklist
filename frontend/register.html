<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPWS — Rejestracja na zawody</title>
  <style>
    /* Page-shell treatment matching doc/mockups/registration_*.html — without
       this the reg-card/el-card floats on a bare white background instead of
       the intended dark page. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px 16px;
    }
    @media (max-width: 480px) {
      body {
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <!-- local: cert points to local Supabase, prod empty (mirrors index.html).
       cloud: GH Actions sed fills both cert+prod with cloud credentials —
       RegistrationElement/EntryListElement pick cert first, else prod (no
       runtime env toggle is exposed on this public page, ADR-079 §6). -->
  <div id="reg-root"
    supabase-cert-url="http://127.0.0.1:54321"
    supabase-cert-key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEwMzkzNTAsImV4cCI6MTk4MzgxMjk5Nn0.eUIt7N8XfsWOivaR0Rvg4mDOR_GMtJ8d3bOL9e8_8A0"
    supabase-prod-url=""
    supabase-prod-key=""
    payee=""
    iban=""
  ></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var eventCode = params.get('event') || '';
      var view = params.get('view') || '';
      var root = document.getElementById('reg-root');
      // view=export is the organizer's FTL seed download (plan §9). It rides on
      // this page rather than a new one because it needs exactly the same
      // credential injection, and the GH Actions sed step that fills them in
      // only knows about the files already in the CE build input. The public
      // WordPress page mounts <spws-ftl-export> directly (ADR-090); this is the
      // same element, reachable without waiting on a CMS edit.
      var tag =
        view === 'list' ? 'spws-entry-list'
        : view === 'export' ? 'spws-ftl-export'
        : 'spws-registration';
      var el = document.createElement(tag);
      el.setAttribute('event', eventCode);
      if (tag === 'spws-ftl-export') {
        // ?lang=en for an organizer who does not read Polish. Absent means
        // Polish, which is the right default for a Polish federation's events.
        el.setAttribute('lang', params.get('lang') || '');
        // ?k=<uuid> is the capability. The element also reads it from the URL
        // itself, so this is belt and braces for a host page that mounts the
        // element with its own attributes instead.
        el.setAttribute('token', params.get('k') || '');
      }
      el.setAttribute('supabase-cert-url', root.getAttribute('supabase-cert-url') || '');
      el.setAttribute('supabase-cert-key', root.getAttribute('supabase-cert-key') || '');
      el.setAttribute('supabase-prod-url', root.getAttribute('supabase-prod-url') || '');
      el.setAttribute('supabase-prod-key', root.getAttribute('supabase-prod-key') || '');
      if (tag === 'spws-registration') {
        // Pass through verbatim — no `|| 'SPWS'` fallback here. An empty value
        // means "use the association details compiled into the bundle"
        // (lib/orgPayment.ts); defaulting to the short form here silently beat
        // the full registered account name a bank transfer needs.
        el.setAttribute('payee', root.getAttribute('payee') || '');
        el.setAttribute('iban', root.getAttribute('iban') || '');
      }
      root.replaceWith(el);
    })();
  </script>
  <script type="module" src="/src/main.ce.ts"></script>
</body>
</html>
