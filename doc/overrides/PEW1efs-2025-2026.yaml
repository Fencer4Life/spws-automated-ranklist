# EVF Circuit Budapest 2025 (Budapest Cup, 20–21 September 2025).
#
# The organiser's V1 men's épée page (engarde-service.com, hunfencing
# 2025_09_20_pbt/me40) prints a Club column where its other brackets print
# Country, and its fencer list has no nationality either. The parser leaves the
# nationality blank there (ENG.NAT.01), so a Pole is kept only when named here.
# An entry fills a blank nationality and never replaces a printed one
# (ADR-105 §1.1; decision C A in
# doc/plans/international-data-repair-batch-1-2026-10-01.html#budapest).
#
# KULKA Dawid, 6th in the same bracket, is on our roster as PL but entered for
# Ireland (EVF: IRL), so he is not named.

nationality:
  - scraped_name: "BOBUSIA Jaroslaw"
    country: POL
    evidence: "EVF results API, event 79 (EVF Circuit Budapest 2025), V1 men's épée: 5th of 33, country POL"
