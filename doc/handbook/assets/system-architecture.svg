<svg viewBox="0 0 1040 730" width="1040" height="730" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-t arch-d">
<title id="arch-t">SPWS Ranklist: what the system does</title>
<desc id="arch-d">Results from eight competition platforms, plus the EVF and PZSz calendars, enter a Python ingestion pipeline run on GitHub Actions. It resolves identity and category and commits into PostgreSQL on Supabase, the single source of truth. There each tournament type's scoring engine stores the scores at import, and views and ranking functions build the rankings. PostgREST exposes curated views and allowlisted RPCs as JSON to a Svelte app and web components embedded in WordPress and GitHub Pages. Administrators write through MFA-protected RPCs. Operators dispatch workflows through Telegram, GAS and Edge Functions, and receive Telegram alerts. A fix to identity puts the affected events on a recompute queue, which the pipeline drains. A live clean-roster loop takes public registrations into FIE-XML seed files that the organizer downloads into Fencing Time; the results the organizer publishes on FTL come back through ordinary ingestion, with 99 per cent auto-resolution as the target. Everything runs in three tiers, LOCAL, CERT and PROD: schema and code move by release, events and results by explicit promotion.</desc>
