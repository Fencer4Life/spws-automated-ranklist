<style>
/* Full-screen FTL export page: the theme's chrome is removed on THIS page only
   (ADR-090 §7), the same treatment and the same selectors as /znajdz-zawody/.
   Selectors read off the rendered page. .footer-bottom is a SIBLING of
   </footer>, not a child, so hiding footer.footer alone leaves it behind. */
header.header,
section.page-image,
.entry-header,
.entry-title,
#slideout,
#facebook,
.footer-image,
footer.footer,
.footer-bottom {
  display: none !important;
}

html, body { margin: 0 !important; padding: 0 !important; }
#content.site-content,
#primary.content,
#primary.content > .content-area,
.entry-content {
  margin: 0 !important;
  padding: 0 !important;
  max-width: none !important;
  width: 100% !important;
}
.spws-embed { margin: 0; padding: 0; }
/* NOT font-size/line-height:0 here — those are INHERITED properties and
   inheritance crosses the shadow boundary, which collapsed the embed's own
   title to a zero-height box. Shadow DOM isolates selectors, not inheritance. */
/* Guard: if wpautop ever reintroduces a <br> here, it costs no height. */
.spws-embed br { display: none !important; }
</style>
