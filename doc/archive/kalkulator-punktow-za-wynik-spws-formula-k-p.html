<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Kalkulator punktów rankingowych SPWS — ile punktów daje zajęte miejsce przy danej liczbie startujących.">
<!-- Plik leży na serwerze, ale nie ma jeszcze trafić do wyszukiwarek ani do
     szermierzy. Gdy zapadnie decyzja o publikacji, USUŃ poniższy wiersz. -->
<meta name="robots" content="noindex, nofollow">
<title>Kalkulator punktów za wynik — SPWS</title>
<style>
:root{
  --paper:#f6f7f9; --card:#fff; --ink:#16202e; --muted:#5d6b7f; --line:#dde3ea;
  --red:#d0202e; --red-soft:#fdeced; --focus:#1d63b8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#121821; --card:#1a2230; --ink:#e9eef6; --muted:#9aa8bd; --line:#2b3646;
        --red:#ff5a63; --red-soft:#3a1a1d; --focus:#7fb0f0;}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;
     line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}

/* ---- nagłówek ---- */
.head{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand img{height:30px;width:auto;display:block}
@media (prefers-color-scheme:dark){
  /* znak jest w ciemnej czerwieni druku — na ciemnym tle wymaga rozjaśnienia */
  .brand img{filter:brightness(1.4) saturate(1.05)}
}
h1{font-size:19px;line-height:1.25;margin:0;font-weight:650;letter-spacing:-.01em}
.dek{margin:0;color:var(--muted);font-size:13.5px}

/* ---- przełączniki ---- */
.switches{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);
     border-radius:9px;padding:3px;gap:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;align-items:center;justify-content:center;min-height:38px;
     padding:0 13px;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted);
     cursor:pointer;user-select:none;white-space:nowrap}
.seg input:checked + label{background:var(--red);color:#fff}
.seg input:focus-visible + label{outline:2px solid var(--focus);outline-offset:2px}
.seg.lang label{min-width:44px;font-family:var(--mono);font-size:13px;letter-spacing:.04em}
.algo-note{margin:6px 0 0;font-size:12.5px;color:var(--muted)}

/* ---- pola ---- */
.fields{display:flex;flex-direction:column;gap:12px;margin:18px 0}
.field{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.field > label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
.field input[type=number]{width:100%;font-size:19px;font-weight:650;font-family:var(--mono);
     min-height:46px;padding:6px 10px;color:var(--ink);background:var(--paper);
     border:1px solid var(--line);border-radius:8px}
.field input[type=number]:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.rank-row{display:flex;align-items:center;gap:12px}
.rank-val{font-family:var(--mono);font-size:19px;font-weight:650;min-width:2.9em;text-align:right}
input[type=range]{flex:1;min-width:0;height:44px;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10.5px;
     border-radius:50%;background:var(--red);border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--red);
     border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}

/* ---- wynik ---- */
.result{background:var(--card);border:1px solid var(--line);border-radius:13px;
        padding:20px 14px;text-align:center;margin:16px 0}
.big{font-size:clamp(44px,15vw,60px);line-height:1;font-weight:700;letter-spacing:-.02em;
     font-variant-numeric:tabular-nums}
.unit{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:.02em}
.sub{margin-top:9px;font-size:13.5px;color:var(--muted)}
.warn{margin:16px 0 0;background:var(--red-soft);border:1px solid var(--red);border-radius:10px;
      padding:11px 13px;font-size:13.5px}

/* ---- rozwijane ---- */
.btn{display:block;width:100%;min-height:48px;background:var(--card);color:var(--ink);
     border:1px solid var(--line);border-radius:11px;font:inherit;font-weight:600;font-size:14.5px;
     cursor:pointer;padding:10px 14px;text-align:left}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn .chev{float:right;color:var(--muted);font-weight:400}
.panel{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;
       max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.panel th,.panel td{padding:9px 14px;font-size:14.5px;text-align:right}
.panel th:first-child,.panel td:first-child{text-align:left}
.panel thead th{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
     font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel tbody tr + tr td{border-top:1px solid var(--line)}
.panel tr.me td{background:var(--red-soft);font-weight:700}
.panel td.pl{font-family:var(--mono)}

details.how{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:11px}
details.how > summary{min-height:48px;display:flex;align-items:center;padding:10px 14px;
     font-weight:600;font-size:14.5px;cursor:pointer;list-style:none}
details.how > summary::-webkit-details-marker{display:none}
details.how > summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400;font-size:18px}
details.how[open] > summary::after{content:"–"}
.how-body{padding:2px 14px 14px;font-size:13.5px;color:var(--muted)}
.how-body dl{display:grid;grid-template-columns:1fr auto;gap:7px 12px;margin:0 0 12px}
.how-body dt{color:var(--muted)}
.how-body dd{margin:0;font-family:var(--mono);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.how-body dl .tot{font-weight:700;border-top:1px solid var(--line);padding-top:7px}
.how-body p{margin:9px 0}
.how-body code{font-family:var(--mono);font-size:12.5px;color:var(--ink)}

footer{margin-top:22px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:359px){
  .wrap{padding:12px 10px 32px}
  .seg label{padding:0 10px;font-size:13.5px}
  .panel th,.panel td{padding:8px 10px}
}
</style>
</head>

<script>
/* ------------------------------------------------------------------ *
 * Silnik punktowy. Obie funkcje przepisane bez zmian z dokumentu
 * doc/plans/Nowy_ranking_indywidualny-kalkulator.html — spws() z score(),
 * evf() z oldScore(). Punktacja liczona zawsze od FAKTYCZNEJ liczby
 * startujących, więc ostatnie miejsce daje 1 punkt niezależnie od stawki
 * (regulamin EVF Ranking System v6, §3.2).
 * ------------------------------------------------------------------ */
const K = 10;      // współczynnik głębokości, ustalony
const P = 1.5;     // wykładnik kształtu, ustalony

function bracket(n){ return n < 2 ? 0 : Math.max(4, Math.pow(2, Math.ceil(Math.log2(n)))); }

function spwsParts(place, n){
  const B = bracket(n);
  if (!B || place > n || place < 1) return null;
  const RB = Math.log2(B);
  const D  = Math.max(2, n);
  const R  = Math.log2(D);
  const u  = Math.log2(place) / R;
  const wp = Math.max(0, R - 4.5) / 3.5;
  const wm = Math.max(0, 4.5 - R) / 2.5;
  const a  = 1 + P * wp;
  const b  = 1 + P * (wp + 1.5 * wm);
  const top = 2 * K * RB;
  const pp  = 1 + (top - 1) * Math.pow(1 - Math.pow(u, a), b);
  const c   = {1:3, 2:2, 3:1}[place] || 0;
  return {place: pp, rounds: null, podium: c * 3 * Math.cbrt(D)};
}

function evfParts(place, n){
  const MP = 50;
  if (n < 1 || place > n || place < 1) return null;
  const pp   = n === 1 ? MP : MP - (MP - 1) * Math.log(place) / Math.log(n);
  const pow2 = (n & (n - 1)) === 0;
  const de   = n <= 1 ? 0
             : Math.max(0, Math.floor(Math.log2(n)) - Math.ceil(Math.log2(place)) + (pow2 ? 0 : 1)) * 10;
  const c    = {1:3, 2:2, 3:1}[place] || 0;
  return {place: pp, rounds: de, podium: c * 3 * Math.cbrt(n)};
}

function parts(place, n, alg){ return alg === 'evf' ? evfParts(place, n) : spwsParts(place, n); }
function total(place, n, w, alg){
  const p = parts(place, n, alg);
  return p === null ? null : (p.place + (p.rounds || 0) + p.podium) * w;
}

    bPlace:'Punkty za miejsce', bRounds:'Bonus za wygrane rundy', bPodium:'Bonus za podium',
    bSum:'Razem', bRank:'× ranga', bTotal:'Wynik',
    howSpws:'Punkty za miejsce mają wchłonięty bonus za wygrane rundy, dlatego nie ma go na osobnej pozycji. Wysokość krzywej i tempo jej opadania zależą od liczby startujących. Stałe formuły: k = 10, p = 1,5. Bonus za podium to 3·∛N, 6·∛N i 9·∛N dla trzeciego, drugiego i pierwszego miejsca.',
    howEvf:'Punkty za miejsce według skali logarytmicznej z maksimum 50, plus 10 punktów za każdą wygraną rundę bezpośredniej eliminacji, plus bonus za podium 3·∛N, 6·∛N i 9·∛N dla trzeciego, drugiego i pierwszego miejsca.'
  },
  en: {
    lang:'en-GB', htmlLang:'en',
    docTitle:'Result points calculator — SPWS',
    title:'Result points calculator',
    dek:'How many ranking points a finishing place is worth.',
    lblN:'Number of entries', lblM:'Finishing place', lblW:'Competition rank coefficient',
    unit:'pts', showAll:'Points for every place', hideAll:'Hide the list of places',
    thPlace:'Place', thPts:'Points',
    howTitle:'How this was calculated', foot:'Polish Veterans Fencing Association',
    noteSpws:'Proposed SPWS formula.',
    noteEvf:'EVF algorithm',
    sub:(m,n,w)=>`${ord(m)} place out of ${n} entries · rank ${w}`,
    errPlace:(n)=>`The finishing place cannot be greater than the number of entries (${n}).`,
    errN:'Enter a number of entries between 2 and 1000.',
    bPlace:'Place points', bRounds:'Round bonus', bPodium:'Podium bonus',
    bSum:'Subtotal', bRank:'× rank', bTotal:'Result',
    howSpws:'The round bonus is absorbed into the place points, so it has no separate line. Both the height of the curve and how fast it falls depend on the number of entries. Fixed constants: k = 10, p = 1.5. The podium bonus is 3·∛N, 6·∛N and 9·∛N for third, second and first place.',
    howEvf:'Place points on a logarithmic scale with a maximum of 50, plus 10 points for every direct-elimination round won, plus a podium bonus of 3·∛N, 6·∛N and 9·∛N for third, second and first place.'
  }
};

function ord(n){
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

let lang = 'pl';
let alg  = 'spws';

const $ = id => document.getElementById(id);

// Formatowanie liczb piszemy sami, bez Intl i bez toLocaleString — plik bywa
// otwierany prosto z dysku telefonu, a tam warto zejść do najprostszych
// mechanizmów języka. Polski przecinek, angielska kropka.
function num(v, dec){
  const s = Math.abs(v).toFixed(dec);
  const sign = v < 0 ? '-' : '';
  return sign + (lang === 'pl' ? s.replace('.', ',') : s);
}
const fmt  = v => num(v, 1);
// rozbicie na składniki idzie z dwoma miejscami po przecinku — przy jednym
// zaokrąglone składniki nie sumują się do zaokrąglonej sumy (8,2 + 5,7 = 14,0)
const fmt2 = v => num(v, 2);

/* ------------------------------------------------------------------ *
 * Przeliczanie — wywoływane przy każdej zmianie któregokolwiek pola
 * ------------------------------------------------------------------ */
function read(){
  const n = parseInt($('fN').value, 10);
  const m = parseInt($('fM').value, 10);
  const w = parseFloat($('fW').value);
  return {n, m, w};
}

function render(){
  const t = T[lang];
  const {n, m, w} = read();
  $('wVal').textContent = fmt(w);
  $('algoNote').textContent = alg === 'evf' ? t.noteEvf : t.noteSpws;
  $('fM').max = Number.isFinite(n) ? n : 1000;

  const nBad = !Number.isFinite(n) || n < 2 || n > 1000;
  const mBad = !nBad && (!Number.isFinite(m) || m < 1 || m > n);

  if (nBad || mBad){
    $('out').textContent = '—';
    $('outSub').textContent = '';
    $('warn').hidden = false;
    $('warn').textContent = nBad ? t.errN : t.errPlace(n);
    $('allBody').innerHTML = '';
    $('breakdown').innerHTML = '';
    $('howText').textContent = '';
    return;
  }
  $('warn').hidden = true;

  const v = total(m, n, w, alg);
  $('out').textContent = fmt(v);
  $('outUnit').textContent = t.unit;
  $('outSub').textContent = t.sub(m, n, fmt(w));

  renderBreakdown(m, n, w);
  renderAll(m, n, w);
}

function renderBreakdown(m, n, w){
  const t = T[lang], p = parts(m, n, alg);
  const sum = p.place + (p.rounds || 0) + p.podium;
  // „Razem" liczone ze składników JUŻ ZAOKRĄGLONYCH, żeby kolumna zgadzała się
  // dla kogoś, kto ją dodaje na kartce; „Wynik" idzie z wartości dokładnych
  const r2 = v => Math.round(v * 100) / 100;
  const shown = r2(p.place) + r2(p.rounds || 0) + r2(p.podium);
  const rows = [[t.bPlace, fmt2(p.place)]];
  if (p.rounds) rows.push([t.bRounds, fmt2(p.rounds)]);   // zero rund — bez pustego wiersza
  if (p.podium) rows.push([t.bPodium, fmt2(p.podium)]);   // poza podium — bez pustego wiersza
  rows.push([t.bSum, fmt2(shown)], [t.bRank, fmt(w)]);
  $('breakdown').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')
    + `<dt class="tot">${t.bTotal}</dt><dd class="tot">${fmt(sum * w)}</dd>`;
  $('howText').textContent = alg === 'evf' ? t.howEvf : t.howSpws;
}

function renderAll(m, n, w){
  let html = '';
  for (let i = 1; i <= n; i++){
    html += `<tr${i === m ? ' class="me" id="meRow"' : ''}><td class="pl">${i}</td>`
          + `<td>${fmt(total(i, n, w, alg))}</td></tr>`;
  }
  $('allBody').innerHTML = html;
  if (!$('allPanel').hidden) scrollToMe(false);
}

function scrollToMe(){
  const row = $('meRow'), panel = $('allPanel');
  if (!row) return;
  // zwykłe przypisanie scrollTop zamiast scrollTo({...}) — starsze przeglądarki
  // telefonów nie przyjmują postaci z obiektem i potrafią na niej wywalić się
  panel.scrollTop = Math.max(0, row.offsetTop - panel.clientHeight / 2 + row.clientHeight / 2);
}

/* ------------------------------------------------------------------ *
 * Język, algorytm, stan interfejsu
 * ------------------------------------------------------------------ */
function applyLang(){
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key === 'showAll') return;              // zależy od stanu panelu
    if (t[key]) el.textContent = t[key];
  });
  setToggleLabel();
}

function setToggleLabel(){
  const open = !$('allPanel').hidden;
  $('btnAll').querySelector('[data-i18n="showAll"]').textContent =
    open ? T[lang].hideAll : T[lang].showAll;
  $('chev').textContent = open ? '–' : '+';
  $('btnAll').setAttribute('aria-expanded', open ? 'true' : 'false');
}

function store(){
  try{ localStorage.setItem('spws-calc', JSON.stringify({lang, alg})); }catch(e){}
}

function param(name){
  // bez URLSearchParams — zwykłe wyrażenie regularne działa wszędzie
  const m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

function restore(){
  let saved = {};
  // dostęp do localStorage potrafi RZUCIĆ WYJĄTKIEM przy otwarciu pliku
  // prosto z dysku (protokół file:) — dlatego cały dostęp jest w klamrze
  try{ saved = JSON.parse(localStorage.getItem('spws-calc') || '{}') || {}; }catch(e){ saved = {}; }
  const l = (param('lang') || saved.lang || '').toLowerCase();
  const a = (param('alg')  || saved.alg  || '').toLowerCase();
  if (l === 'en' || l === 'pl') lang = l;
  if (a === 'evf' || a === 'spws') alg = a;
  $(lang === 'en' ? 'langEn' : 'langPl').checked = true;
  $(alg === 'evf' ? 'algEvf' : 'algSpws').checked = true;
}

document.querySelectorAll('input[name=lang]').forEach(r =>
  r.addEventListener('change', () => {
    if (!r.checked) return;
    lang = r.value; store(); applyLang(); render();
  }));
document.querySelectorAll('input[name=alg]').forEach(r =>
  r.addEventListener('change', () => {
    if (!r.checked) return;
    alg = r.value; store(); render();
  }));
['fN','fM','fW'].forEach(id => $(id).addEventListener('input', render));

$('btnAll').addEventListener('click', () => {
  const panel = $('allPanel');
  panel.hidden = !panel.hidden;
  setToggleLabel();
  if (!panel.hidden) scrollToMe(false);
});

// Gdyby cokolwiek wysypało się przy starcie, ma to być widać NA STRONIE,
// a nie w konsoli — na telefonie nikt do konsoli nie zajrzy.
try {
  restore();
  applyLang();
  render();
} catch (err) {
  const box = document.getElementById('warn');
  if (box){
    box.hidden = false;
    box.textContent = 'Kalkulator nie wystartował / The calculator failed to start: '
                    + (err && err.message ? err.message : String(err));
  }
}
</script>
</body>
</html>
