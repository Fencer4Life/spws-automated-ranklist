name: PZSz Start Lists → CERT

# A PZSz start list exists only from four days before an event's first day to
# one day before it (D-4..D-1), and is closed from day D. Its birth years are
# what the PZSz admission compares (ADR-111), so a missed window stops the
# result ingest. This workflow captures every in-window event's start lists to
# CERT, by a real browser engine that runs pzszerm.pl's own JavaScript check
# (ADR-116 §6), five times a day so a list that appears at any hour is caught.
#
# SEPARATE FROM pzsz-sync.yml, ON ITS OWN SCHEDULE. The calendar sync runs once
# a day; the start-list window needs several attempts a day and its own
# red/green. CERT ONLY — it writes no PROD and joins no prod-write queue;
# PROD receives start lists only through the verified promote replay
# (ADR-108, ADR-112 §4).
#
# WINDOW, TWO INDEPENDENT CHECKS (ADR-112 §2). "Today" is the Warsaw date the
# run was due on (zoneinfo Europe/Warsaw), so the 25 October clock change cannot
# shift it. The five crons are set in UTC, eleven minutes past the hour, so every
# attempt is due between 06:11 and 21:11 Warsaw in both summer (UTC+2 →
# 07:11..21:11) and winter time (UTC+1 → 06:11..20:11). GitHub starts scheduled
# runs late (measured 0.2-3.5 hours), so a late final run can start after
# midnight Warsaw time; it still works on the day it was due, for the window
# and its alarms (PZSZ.SL.10). A manual run works on today. Check 1 is the run's
# selection (select_window_events); check 2 is the reader
# (read_event_start_lists_for_capture), which refuses any page of an
# out-of-window event whoever asks.

on:
  schedule:
    - cron: '11 5 * * *'   # first run  — 06:11/07:11 Warsaw
    - cron: '11 9 * * *'   #            — 10:11/11:11 Warsaw
    - cron: '11 13 * * *'  #            — 14:11/15:11 Warsaw
    - cron: '11 17 * * *'  #            — 18:11/19:11 Warsaw
    - cron: '11 19 * * *'  # final run  — 20:11/21:11 Warsaw
  workflow_dispatch:

# ADR-083: least-privilege GITHUB_TOKEN.
permissions:
  contents: read

# One capture at a time; a run is never cancelled in flight (an idempotent
# store makes overlap harmless, but there is no reason to pay for it twice).
concurrency:
  group: pzsz-start-lists
  cancel-in-progress: false

jobs:
  capture:
    name: Capture start lists → CERT
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # httpx + beautifulsoup4 for the CERT Management API and the parsers;
      # playwright drives the headless Chromium that renders the gated pages.
      - name: Install dependencies
        run: pip install httpx beautifulsoup4 playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # The cron that fired decides whether this is the day's first run (the
      # window-open notice) or its last (the red line if a list is still
      # missing). A manual run is neither.
      - name: Capture PZSz start lists → CERT
        id: capture
        env:
          # github.event.schedule is one of this workflow's own cron strings
          # (or empty for a manual run); read it via env, never interpolated
          # into the shell, so there is no injection surface.
          SCHEDULE: ${{ github.event.schedule }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CERT_REF: ${{ secrets.SUPABASE_CERT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=(capture)
          case "$SCHEDULE" in
            "11 5 * * *")  ARGS+=(--first-run) ;;
            "11 19 * * *") ARGS+=(--final-run) ;;
          esac
          # The cron that fired, so a late run works on the day it was due (PZSZ.SL.10-12).
          if [ -n "$SCHEDULE" ]; then
            ARGS+=(--cron "$SCHEDULE")
          fi
          python -m python.scrapers.pzsz_start_list_store "${ARGS[@]}"

      # The capture alerts on Telegram itself (ADR-116 §11-§12, one digest), so
      # this speaks only when it never ran: a failed install (WFALERT.01).
      - name: Notify setup failure
        if: failure() && steps.capture.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=PZSz start-list capture FAILED before it started (a setup step). Check: ${RUN_URL}" > /dev/null
