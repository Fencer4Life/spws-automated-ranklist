name: EVF Parity Sweep

# Phase 4 (ADR-053) — daily probe of every EVF event still at
# ENGINE_COMPUTED status. PASS → promote to EVF_PUBLISHED, overwrite
# scores with EVF API verbatim. FAIL → annotate txt_parity_notes.
# Empty after 30 days → annotate and stop probing.
#
# As it stands nothing is ever compared: the fetch reads each event's url_event,
# the organiser's page rather than EVF's results API, and returns no rows
# (python/pipeline/evf_parity_sweep.py _default_fetch_evf_api). What the sweep
# should do is decision W2 #5 of doc/plans/github-actions-workflows-page-2026-10-24.html.

on:
  schedule:
    # Daily at 04:17 UTC. Cheap — only EVF events at ENGINE_COMPUTED
    # within the last 60 days are probed.
    - cron: '17 4 * * *'   # off the hour (WFCRON.01); same minute as event-close.yml
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Skip events older than N days (default 60)'
        default: '60'
      evf_empty_stop_days:
        description: 'Annotate "EVF API empty" after N days past dt_end (default 30)'
        default: '30'

# ADR-083: least-privilege GITHUB_TOKEN. Default repo scope is far wider than
# any job here needs; an injected step should not inherit write access.
permissions:
  contents: read   # checkout only; all DB writes use SUPABASE_* service-role secrets

jobs:
  parity-sweep:
    name: EVF Parity Sweep
    runs-on: ubuntu-latest
    # Serialise with other ingestion writers (commits, ingest, promote).
    concurrency:
      group: prod-write
      cancel-in-progress: false
      # queue: max on EVERY member of prod-write. The setting is per-job and
      # GitHub queues only ONE pending job per group, cancelling the pending one
      # when a new job arrives -- so a member without it can silently cancel a
      # sibling's pending promote. Enforced and explained by python/tests/test_workflow_lanes.py (WFLANE.01).
      queue: max
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 rapidfuzz supabase pyyaml

      - name: Run parity sweep
        env:
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '60' }}
          EVF_EMPTY_STOP_DAYS: ${{ github.event.inputs.evf_empty_stop_days || '30' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m python.pipeline.evf_parity_sweep \
            --max-age-days "$MAX_AGE_DAYS" \
            --evf-empty-stop-days "$EVF_EMPTY_STOP_DAYS"

      - name: Notify failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🚨 EVF parity sweep FAILED. Check: https://github.com/${REPO}/actions/runs/${RUN_ID}"
