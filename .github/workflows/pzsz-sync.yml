name: PZSz Senior Calendar Sync

# Polish veterans also enter senior national competitions run by Polski Zwiazek
# Szermierczy. This scrapes the PPS and MPS calendar into CERT and promotes it
# to PROD. Scoring those results is a separate deliverable; nothing here
# anticipates it.
#
# WHY A SEPARATE WORKFLOW AND NOT A JOB INSIDE evf-sync.yml. A job there would
# share one run identity: a single red/green, one re-run button, and a set of
# workflow_dispatch inputs that are EVF-specific. Job-level independence would
# be real; run-level independence would not -- and the run is what an operator
# actually looks at.
#
# SAME MINUTE AS evf-sync.yml, DELIBERATELY. The two scrape jobs carry no
# concurrency group and genuinely run in parallel; only the promotes serialise.
# That is safe because `promote --mode calendar` is a whole-active-season
# create/update/delete reconciler keyed on txt_code (ADR-081): it converges
# EVERYTHING in CERT, not just the rows the calling workflow scraped. So the two
# promotes are mutually redundant by construction -- if this one fails, EVF's
# converges the PZSz rows minutes later, and vice versa. CERT is the source of
# truth for the calendar and is never left wrong by a promote failure.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and print the statements without writing to CERT'
        type: boolean
        default: false

# ADR-083: least-privilege GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  sync:
    name: PZSz Sync → CERT
    runs-on: ubuntu-latest
    # No concurrency group on purpose. This job touches nothing on PROD, so it
    # runs genuinely in parallel with the EVF scrape rather than queueing behind
    # a promote that has nothing to do with it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # pypdf reads the organizer's komunikat for the venue street address.
      - name: Install dependencies
        run: pip install httpx beautifulsoup4 pypdf

      - name: Sync PZSz calendar → CERT
        run: python -m python.scrapers.pzsz_sync ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CERT_REF: ${{ secrets.SUPABASE_CERT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="PZSz calendar sync FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  promote-calendar:
    name: Promote calendar → PROD
    needs: sync
    # Run even if the scrape failed. Not cosmetic: evf-sync.yml documents at
    # length that without this condition an upstream failure silently SKIPS the
    # promote, which cost 13 unpromoted events on 2026-07-14 (run 29309139092).
    # Only a cancelled workflow run skips this job.
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    # contents: write so the reconcile run log can be committed back.
    permissions:
      contents: write
    concurrency:
      group: prod-write
      cancel-in-progress: false
      # queue: max is on EVERY member of prod-write, not just this job. The
      # setting is per-job, and GitHub's default is that only ONE job may be
      # pending per group -- a newly queued job CANCELS the already-pending one.
      # With evf-sync.yml holding the group for its pre-scrape promote, this
      # promote would sit pending and EVF's later promote would cancel it.
      # Silently: cancelled is not failed, so nothing would alert. Protecting
      # only this job would leave it cancellable by the others.
      queue: max
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx supabase

      - name: Promote calendar CERT → PROD
        run: python -m python.pipeline.promote --mode calendar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CERT_REF: ${{ secrets.SUPABASE_CERT_REF }}
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
          SUPABASE_CERT_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_CERT_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit reconcile run log
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doc/staging/reconcile/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No reconcile report to commit"
          else
            git commit -m "chore: CERT→PROD reconcile run log (PZSz) [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt) -- fetching and rebasing"
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" = "5" ]; then
                echo "::error::git push failed after 5 attempts"
                exit 1
              fi
            done
          fi

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="PZSz calendar promote FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
