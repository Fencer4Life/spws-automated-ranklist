name: PZSz Senior Calendar Sync

# Polish veterans also enter senior national competitions run by Polski Zwiazek
# Szermierczy. This scrapes the PPS and MPS calendar into CERT, and
# promote-calendar.yml mirrors it to PROD. Their results reach CERT through
# ingest-event.yml and PROD through promote.yml like every organizer's
# (ADR-111, ADR-113); this workflow carries the calendar only.
#
# WHY A SEPARATE WORKFLOW AND NOT A JOB INSIDE evf-sync.yml. A job there would
# share one run identity: a single red/green, one re-run button, and a set of
# workflow_dispatch inputs that are EVF-specific. Job-level independence would
# be real; run-level independence would not -- and the run is what an operator
# actually looks at.
#
# SAME MINUTE AS evf-sync.yml, DELIBERATELY. The two scrape jobs carry no
# concurrency group and genuinely run in parallel; only the promotes serialise.
# That is safe because `promote --mode calendar` is a whole-active-season
# create/update/delete reconciler keyed on txt_code (ADR-081): it converges
# EVERYTHING in CERT, not just the rows the calling workflow scraped. So the two
# promotes are mutually redundant by construction -- if this one fails, EVF's
# converges the PZSz rows minutes later, and vice versa. CERT is the source of
# truth for the calendar and is never left wrong by a promote failure.

on:
  schedule:
    - cron: '23 6 * * *'   # off the hour (WFCRON.01); same minute as evf-sync.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and print the statements without writing to CERT'
        type: boolean
        default: false

# ADR-083: least-privilege GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  sync:
    name: PZSz Sync → CERT
    runs-on: ubuntu-24.04
    # No concurrency group on purpose. This job touches nothing on PROD, so it
    # runs genuinely in parallel with the EVF scrape rather than queueing behind
    # a promote that has nothing to do with it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # httpx + beautifulsoup4 for the CERT API and the parsers; pypdf reads the
      # organizer's letter (pass 2-4); playwright drives the headless Chromium
      # that renders the gated listing (ADR-116 §6).
      - name: Install dependencies
        run: pip install httpx beautifulsoup4 pypdf playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # The run sends its own one digest (R6) and reports any top-level failure
      # on Telegram itself, so the notify step below speaks only when this step
      # never ran: a second message on a fatal run would break ADR-116 §11-§12
      # (one digest).
      # Its exit status is red only for a fatal event; the job colour reflects it.
      - name: Sync PZSz calendar → CERT
        id: sync
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CERT_REF: ${{ secrets.SUPABASE_CERT_REF }}
          # Read only: the ingest notice reads the results link set in PROD's Admin (D2 A).
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FLAG=""
          [ "$DRY_RUN" = "true" ] && FLAG="--dry-run"
          python -m python.scrapers.pzsz_sync $FLAG

      # A failed install before the sync leaves it no chance to alert (WFALERT.01).
      - name: Notify setup failure
        if: failure() && steps.sync.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=PZSz calendar sync FAILED before it started (a setup step). Check: ${RUN_URL}" > /dev/null

  # Start-list capture moved to its own workflow, pzsz-start-lists.yml (ADR-116
  # §10): it needs several attempts a day inside each event's window, D-4 to
  # the morning of its last day (ADR-112 amendment of 2026-10-25),
  # and a real browser engine to render the gated pages, neither of which fits
  # the once-a-day calendar sync. It is CERT-only and promotes nothing.

  # The CERT→PROD calendar mirror is the shared reusable workflow
  # promote-calendar.yml (one definition for every sync). It runs right after
  # the PZSz scrape has written CERT, carrying this run's calendar changes
  # (fees, addresses, dates from the letter passes) to PROD in the same run.
  promote-calendar:
    name: Promote calendar → PROD
    needs: sync
    # Run even if the scrape failed -- a broken scrape must not strand admin
    # edits or already-committed CERT events. Only a cancelled run skips it.
    # (evf-sync.yml documents the 13-event miss of 2026-07-14, run 29309139092.)
    if: ${{ !cancelled() && !inputs.dry_run }}
    # contents: write so the reusable workflow's reconcile-log push works --
    # this workflow's top-level is contents: read (ADR-083), and a called
    # workflow's permissions are capped by the caller's token.
    permissions:
      contents: write
    uses: ./.github/workflows/promote-calendar.yml
    with:
      label: PZSz
    secrets: inherit
