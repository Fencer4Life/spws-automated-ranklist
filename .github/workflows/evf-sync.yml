name: EVF Calendar + Results Sync

on:
  schedule:
    # Daily at 06:00 UTC. The --filter-stale flag (passed only on scheduled
    # runs) skips events that already have results in CERT, so the daily
    # cadence is cheap. Manual workflow_dispatch keeps full-scrape semantics.
    - cron: '23 6 * * *'   # off the hour (WFCRON.01); same minute as pzsz-sync.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'calendar | results | both'
        default: 'both'
      event_code:
        description: 'Event code for results mode (e.g. PEW7-2025-2026)'
        required: false
      filter_stale:
        description: 'Skip events already scored in CERT (defaults true on cron, false on manual)'
        type: boolean
        default: false

# ADR-083: least-privilege GITHUB_TOKEN. Default repo scope is far wider than
# any job here needs; an injected step should not inherit write access.
permissions:
  contents: write   # commits + pushes the CERT->PROD reconcile run log

jobs:
  sync:
    name: EVF Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 rapidfuzz pypdf

      - name: Run EVF sync
        run: |
          # On scheduled runs, default to --filter-stale so daily cadence is cheap.
          # On manual dispatch, honour the workflow input toggle.
          # Inputs come in through env, never as ${{ }} in this script (WFINJ.01).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FLAG="--filter-stale"
          elif [ "$FILTER_STALE" = "true" ]; then
            FLAG="--filter-stale"
          else
            FLAG=""
          fi
          python -m python.scrapers.evf_sync \
            --mode "$MODE" \
            --event-code "$EVENT_CODE" \
            $FLAG
        env:
          MODE: ${{ github.event.inputs.mode || 'both' }}
          EVENT_CODE: ${{ github.event.inputs.event_code || '' }}
          FILTER_STALE: ${{ github.event.inputs.filter_stale }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CERT_REF: ${{ secrets.SUPABASE_CERT_REF }}
          # FTL creds let the ADR-070 self-heal re-derive real event dates from
          # the (login-walled) FTL results pages before halting on a
          # future-COMPLETED row.
          FTL_USERNAME: ${{ secrets.FTL_USERNAME }}
          FTL_PASSWORD: ${{ secrets.FTL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="EVF sync FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # The CERT→PROD calendar mirror is the shared reusable workflow
  # promote-calendar.yml (one definition for every sync). It runs right after
  # the scrape has written CERT, carrying this run's calendar changes to PROD.
  promote-calendar:
    name: Promote EVF calendar → PROD
    needs: sync
    # Run when mode ∈ {calendar, both} (default 'both' on cron), skip on
    # results-only dispatch. !cancelled() so a failed sync still promotes
    # whatever is already on CERT -- a broken scrape must not strand admin
    # edits or a prior run's committed events (observed 2026-07-14, run
    # 29309139092: sync landed 13 events but the promote was skipped).
    if: ${{ !cancelled() && github.event.inputs.mode != 'results' }}
    # contents: write so the reusable workflow's reconcile-log push works
    # (capped by the caller's token; top-level here is already write).
    permissions:
      contents: write
    uses: ./.github/workflows/promote-calendar.yml
    with:
      label: EVF
    secrets: inherit
