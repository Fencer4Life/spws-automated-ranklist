name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  # ─── Gate ─────────────────────────────────────────────────────────
  # ADR-094: when everything that changed since PROD last deployed is
  # documentation, the build/deploy chain is skipped — nothing it produces
  # differs from what is already on CERT/PROD. `workflow_run` carries no
  # `before` SHA, so scripts/release-gate.sh measures from the commit PROD last
  # deployed, read from deployed_migrations.json on main (ADR-094 amendment
  # 2026-10-24): a change whose release never ran stays in the range. It fails
  # OPEN — any manual dispatch, or anything it cannot resolve with confidence,
  # deploys.
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Run release gate
        id: gate
        env:
          RELEASE_GATE_EVENT: ${{ github.event_name }}
          RELEASE_GATE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/release-gate.sh

  # ─── Build ────────────────────────────────────────────────────────
  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      schema_fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      # Pin to latest main — the SAME commit deploy-cert/deploy-prod apply via
      # `git pull origin main`. Without this, build checks out the triggering CI
      # commit (github.sha); if a migration-bearing commit lands on main while an
      # earlier release run is mid-flight, deploy applies the new migration but
      # build's fingerprint is from the old commit → false fingerprint mismatch
      # at the deploy gate (the 2026-06-25 PROD-deploy failure).
      - uses: actions/checkout@v5
        with:
          ref: main

      # --- Schema fingerprint from LOCAL Docker Supabase ---
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. `latest` makes the action resolve the version
          # through the GitHub releases API on every job, unauthenticated, and
          # that lookup is rate-limited: it failed deploy-cert and then
          # deploy-prod within one evening on 2026-09-05, each time needing a
          # manual re-run of a job that had nothing wrong with it. 2.116.0 is
          # what `latest` was already resolving to on the green runs, so this
          # freezes current behaviour rather than changing it.
          version: 2.116.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Compute LOCAL schema fingerprint
        id: fingerprint
        run: |
          FP=$(bash scripts/schema-fingerprint.sh local)
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "Schema fingerprint: $FP"

      - name: Stop Supabase
        run: supabase stop

      # --- Release manifest: a dry run ---
      # This copy never leaves the runner. It proves generate-manifest.sh runs on
      # this tree before anything deploys; deploy-cert writes the committed
      # release-manifest.json inside its tracking commit.
      - name: Generate release manifest
        run: bash scripts/generate-manifest.sh "${{ steps.fingerprint.outputs.fingerprint }}"

      # --- Frontend build ---
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Inject Supabase credentials (CERT + PROD)
        working-directory: frontend
        run: |
          sed -i 's|supabase-cert-url="[^"]*"|supabase-cert-url="${{ secrets.SUPABASE_CERT_URL }}"|' index.html
          sed -i 's|supabase-cert-key="[^"]*"|supabase-cert-key="${{ secrets.SUPABASE_CERT_ANON_KEY }}"|' index.html
          sed -i 's|supabase-prod-url="[^"]*"|supabase-prod-url="${{ secrets.SUPABASE_PROD_URL }}"|' index.html
          sed -i 's|supabase-prod-key="[^"]*"|supabase-prod-key="${{ secrets.SUPABASE_PROD_ANON_KEY }}"|' index.html
          # ADR-079 amend — register.html (standalone registration page) is built
          # by the CE bundle (vite.config.ce.ts), not the main one: Svelte only
          # bundles a nested (non-customElement) child component's <style> into a
          # shadow root when the WHOLE compile graph runs with customElement:true,
          # so RegistrationForm/EntryList render unstyled under the main build's
          # plain config. Inject creds into the same shared source file here;
          # both builds below read it.
          #
          # PROD ONLY — deliberately no supabase-cert-* injection here. This is
          # the public page a fencer opens from the calendar link, and
          # RegistrationElement resolves its client as
          #   (supabaseCertUrl || supabaseProdUrl)
          # so a populated CERT pair silently wins and every real registration
          # lands in CERT. index.html keeps both pairs (it has a runtime admin
          # toggle); this page has none by design (ADR-079 §6), so it gets
          # exactly one environment: PROD. Leaving the cert attributes at their
          # committed LOCAL values is not an option either — the build's
          # "no localhost in dist" guard would (correctly) fail — so the
          # attributes are blanked instead.
          sed -i 's|supabase-cert-url="[^"]*"|supabase-cert-url=""|' register.html
          sed -i 's|supabase-cert-key="[^"]*"|supabase-cert-key=""|' register.html
          sed -i 's|supabase-prod-url="[^"]*"|supabase-prod-url="${{ secrets.SUPABASE_PROD_URL }}"|' register.html
          sed -i 's|supabase-prod-key="[^"]*"|supabase-prod-key="${{ secrets.SUPABASE_PROD_ANON_KEY }}"|' register.html

          # Design step 8 — the published calculator and the scoring-table annex
          # fetch their season's scoring parameters from fn_public_scoring_params,
          # so they need the same credentials. They are plain files under public/,
          # which Vite copies verbatim, so the attributes live on a hidden
          # #spws-env div rather than on a custom element. Each copy gets exactly
          # ONE pair: both pages resolve (cert || prod), so a populated CERT pair
          # would silently win. The committed values are LOCAL placeholders; the
          # "no localhost in dist" guard below fails the build if this step is
          # ever skipped.
          #
          # ADR-109 (FR-151): github.io is CERT. The root copies, at the
          # addresses old bookmarks hold, are CERT copies under the TEST ribbon.
          for page in public/kalkulator-punktow.html public/tabela-punktacji.html; do
            sed -i 's|data-supabase-cert-url="[^"]*"|data-supabase-cert-url="${{ secrets.SUPABASE_CERT_URL }}"|' "$page"
            sed -i 's|data-supabase-cert-key="[^"]*"|data-supabase-cert-key="${{ secrets.SUPABASE_CERT_ANON_KEY }}"|' "$page"
            sed -i 's|data-supabase-prod-url="[^"]*"|data-supabase-prod-url=""|' "$page"
            sed -i 's|data-supabase-prod-key="[^"]*"|data-supabase-prod-key=""|' "$page"
          done
          # ADR-090 amendment 2026-10-03 (FR-150): the embed/ copies are what
          # <spws-document> frames on weteraniszermierki.pl — PROD only. The
          # guard after the build fails the release if one carries the CERT pair.
          for page in public/embed/kalkulator-punktow.html public/embed/tabela-punktacji.html; do
            sed -i 's|data-supabase-cert-url="[^"]*"|data-supabase-cert-url=""|' "$page"
            sed -i 's|data-supabase-cert-key="[^"]*"|data-supabase-cert-key=""|' "$page"
            sed -i 's|data-supabase-prod-url="[^"]*"|data-supabase-prod-url="${{ secrets.SUPABASE_PROD_URL }}"|' "$page"
            sed -i 's|data-supabase-prod-key="[^"]*"|data-supabase-prod-key="${{ secrets.SUPABASE_PROD_ANON_KEY }}"|' "$page"
          done

      - name: Build frontend
        working-directory: frontend
        run: npx vite build --base ./

      - name: Build + merge register.html (CE bundle)
        working-directory: frontend
        run: |
          npx vite build --config vite.config.ce.ts --base ./
          cp dist-ce/register.html dist/register.html
          mkdir -p dist/assets
          cp -r dist-ce/assets/. dist/assets/

      - name: Verify no secrets or localhost in build
        run: |
          ! grep -r 'service_role' frontend/dist/
          ! grep -r '127.0.0.1' frontend/dist/
          ! grep -r 'supabase-demo' frontend/dist/

      # ADR-090 amendment 2026-10-03 / ADR-109 — the WordPress pages frame
      # frontend/dist/embed/*.html, and they must be PROD and only PROD: a CERT
      # pair there would win (cert || prod) on the association's live site.
      - name: Verify the WordPress embed copies are PROD-only
        run: |
          for name in kalkulator-punktow tabela-punktacji; do
            page="frontend/dist/embed/${name}.html"
            test -f "$page" \
              || { echo "::error::${page} is missing — the WordPress page /${name}/ frames it."; exit 1; }
            if grep -qE 'data-supabase-cert-(url|key)="[^"]+"' "$page"; then
              echo "::error::${page} carries a CERT pair — the embed copies must be PROD-only."
              exit 1
            fi
            grep -qE 'data-supabase-prod-url="https://[^"]+"' "$page" \
              || { echo "::error::${page} has no PROD URL — the injection step did not reach it."; exit 1; }
          done

      # PROD deployment step 1 — the WordPress page at
      # weteraniszermierki.pl/znajdz-zawody/ hard-codes this exact URL:
      #   https://fencer4life.github.io/spws-automated-ranklist/assets/main.ce.js
      # It is the one file on Pages whose NAME is part of another system's
      # configuration, so a rename does not fail here — it fails silently, on a
      # live page on the association's website, whenever someone next looks at
      # it. vite.config.ce.ts pins the name via output.entryFileNames; this
      # guard makes a regression (a Vite upgrade restoring content hashes, or
      # that option being dropped) fail the release instead.
      - name: Verify the embedded bundle keeps its stable name
        run: |
          test -f frontend/dist/assets/main.ce.js \
            || { echo "::error::frontend/dist/assets/main.ce.js is missing — the WordPress embed at /znajdz-zawody/ points at this exact path. Check output.entryFileNames in frontend/vite.config.ce.ts."; \
                 echo "assets/ contains:"; ls -1 frontend/dist/assets/; exit 1; }
          # A hashed sibling means the stable file is a leftover, not the build.
          if ls frontend/dist/assets/ | grep -qE '^main\.ce-[A-Za-z0-9_-]+\.js$'; then
            echo "::error::a content-hashed main.ce-<hash>.js was emitted alongside the stable name — the embed would load a stale bundle."
            ls -1 frontend/dist/assets/
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # The last step, so it sees every step before it (WFALERT.01).
      - name: Notify build failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Release build FAILED: nothing was deployed. Check: ${RUN_URL}" > /dev/null

  # ─── Deploy Pages ─────────────────────────────────────────────────
  deploy-pages:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── Deploy CERT ──────────────────────────────────────────────────
  deploy-cert:
    needs: build
    environment: cert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for pending CERT migrations
        id: check
        run: bash scripts/check-new-migrations.sh cert

      - name: Apply migrations to CERT
        if: steps.check.outputs.has_new_migrations == 'true'
        id: apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_REF: ${{ secrets.SUPABASE_CERT_REF }}
        run: |
          bash scripts/apply-migrations.sh cert "${{ needs.build.outputs.schema_fingerprint }}"

      - name: Verify CERT fingerprint (no new migrations)
        if: steps.check.outputs.has_new_migrations != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_REF: ${{ secrets.SUPABASE_CERT_REF }}
        run: |
          CLOUD_FP=$(bash scripts/schema-fingerprint.sh cloud "$SUPABASE_REF")
          LOCAL_FP="${{ needs.build.outputs.schema_fingerprint }}"
          if [ "$CLOUD_FP" != "$LOCAL_FP" ]; then
            echo "ERROR: CERT fingerprint mismatch!" >&2
            echo "  LOCAL: $LOCAL_FP" >&2
            echo "  CERT:  $CLOUD_FP" >&2
            exit 1
          fi
          echo "CERT fingerprint verified: $CLOUD_FP"

      # ADR-041: deploy Edge Functions to CERT. Idempotent — Supabase replaces
      # the function on each deploy. Function source: supabase/functions/.
      - uses: supabase/setup-cli@v1
        with:
          # Pinned for the same reason as the build job above: `latest` costs a
          # rate-limited GitHub API lookup per job. Keep all three in step.
          version: 2.116.0
      - name: Deploy Edge Functions to CERT
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy dispatch-workflow \
            --project-ref "${{ secrets.SUPABASE_CERT_REF }}" \
            --no-verify-jwt=false

      # ADR-083. Deliberately here, in the deploy job, and not left to CI's
      # pgTAP: the build job carries
      #   if: github.event_name == 'workflow_dispatch' || ...
      # whose first clause is unconditional, so a hand-triggered release skips
      # CI and every assertion in it. Running the posture check inside deploy
      # makes it un-routable. It also checks the RIGHT thing — pgTAP proves
      # what LOCAL looks like after replaying migrations; this proves what CERT
      # actually looks like, which is the thing that silently drifted for four
      # months while LOCAL looked fine.
      - name: Verify security posture (CERT)
        id: posture
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/check-security-posture.sh "${{ secrets.SUPABASE_CERT_REF }}" CERT

      # The Supabase advisory fired weekly from 6 May and every message but the
      # last went unread. Detection already existed; DELIVERY failed. Telegram
      # is the channel this project actually reacts to.
      # Only for the posture check itself: failure() alone is true after any
      # earlier failed step, such as a migration that failed to apply, and this
      # message would then name the wrong cause (WFALERT.02).
      - name: Notify posture failure (CERT)
        if: failure() && steps.posture.outcome == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="SECURITY POSTURE REGRESSION on CERT (ADR-083) — release halted before PROD. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Every deploy records the commit it deployed, with or without migrations:
      # release-gate.sh measures the next release from .prod.last_sha (ADR-094
      # amendment 2026-10-24), and a field that moved only on migration releases
      # would make every later docs-only change deploy.
      - name: Update tracking files
        run: |
          bash scripts/update-tracking.sh cert \
            "${{ github.sha }}" \
            "${{ needs.build.outputs.schema_fingerprint }}" \
            '${{ steps.check.outputs.new_migrations }}'

      - name: Commit tracking update
        # Retry-and-regenerate instead of stash/rebase/stash-pop: the old
        # sequence stashed a locally-computed JSON diff, pulled, then tried
        # to 3-way-merge that stash back in -- guaranteed to CONFLICT
        # whenever two Release runs land close together, since both compute
        # independent diffs of the same auto-generated file (observed live
        # 2026-07-14: a manual dispatch and the CI-triggered run collided,
        # the second's tracking commit failed outright). update-tracking.sh
        # is idempotent -- it re-derives the file from whatever's on disk --
        # so on a push race we just re-fetch, reset to the new tip (safe:
        # this is a disposable checkout, no other local work exists), and
        # regenerate + recommit against that fresh base instead of merging.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # The manifest describes this release: version, migration and test
            # counts. generate-manifest.sh keeps its deployed block, and
            # update-tracking.sh then stamps CERT into it.
            bash scripts/generate-manifest.sh "${{ needs.build.outputs.schema_fingerprint }}"
            bash scripts/update-tracking.sh cert \
              "${{ github.sha }}" \
              "${{ needs.build.outputs.schema_fingerprint }}" \
              '${{ steps.check.outputs.new_migrations }}'
            git add deployed_migrations.json release-manifest.json
            git commit -m "chore: update CERT tracking [skip ci]"
            if git push; then
              echo "Pushed on attempt $attempt"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Failed to push CERT tracking update after 5 attempts" >&2
              exit 1
            fi
            echo "Push rejected (race with a concurrent release run) -- refetching and retrying ($attempt/5)"
            sleep $(( (RANDOM % 5) + 1 ))
            git fetch origin main
            git reset --hard origin/main
          done

      # Every failure but the posture check's, which has its own message above:
      # migrations, fingerprint, Edge Function or the tracking push (WFALERT.01).
      - name: Notify deploy failure (CERT)
        if: failure() && steps.posture.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Release: CERT deploy FAILED, so PROD was not deployed. Check: ${RUN_URL}" > /dev/null

  # ─── Deploy PROD ──────────────────────────────────────────────────
  deploy-prod:
    needs: [build, deploy-cert, deploy-pages]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Pull latest (includes CERT tracking commit)
        run: git pull origin main

      - name: Check for pending PROD migrations
        id: check
        run: bash scripts/check-new-migrations.sh prod

      - name: Apply migrations to PROD
        if: steps.check.outputs.has_new_migrations == 'true'
        id: apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_REF: ${{ secrets.SUPABASE_PROD_REF }}
        run: |
          bash scripts/apply-migrations.sh prod "${{ needs.build.outputs.schema_fingerprint }}"

      - name: Verify PROD fingerprint (no new migrations)
        if: steps.check.outputs.has_new_migrations != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_REF: ${{ secrets.SUPABASE_PROD_REF }}
        run: |
          CLOUD_FP=$(bash scripts/schema-fingerprint.sh cloud "$SUPABASE_REF")
          LOCAL_FP="${{ needs.build.outputs.schema_fingerprint }}"
          if [ "$CLOUD_FP" != "$LOCAL_FP" ]; then
            echo "ERROR: PROD fingerprint mismatch!" >&2
            echo "  LOCAL: $LOCAL_FP" >&2
            echo "  PROD:  $CLOUD_FP" >&2
            exit 1
          fi
          echo "PROD fingerprint verified: $CLOUD_FP"

      # ADR-041: deploy Edge Functions to PROD.
      - uses: supabase/setup-cli@v1
        with:
          # Pinned for the same reason as the build job above: `latest` costs a
          # rate-limited GitHub API lookup per job. Keep all three in step.
          version: 2.116.0
      - name: Deploy Edge Functions to PROD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy dispatch-workflow \
            --project-ref "${{ secrets.SUPABASE_PROD_REF }}" \
            --no-verify-jwt=false

      # ADR-083 — see the equivalent step in deploy-cert for why this lives in
      # the deploy job rather than relying on CI having run.
      - name: Verify security posture (PROD)
        id: posture
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/check-security-posture.sh "${{ secrets.SUPABASE_PROD_REF }}" PROD

      # Only for the posture check itself: failure() alone is true after any
      # earlier failed step, such as a migration that failed to apply, and this
      # message would then name the wrong cause (WFALERT.02).
      - name: Notify posture failure (PROD)
        if: failure() && steps.posture.outcome == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="SECURITY POSTURE REGRESSION on PROD (ADR-083). Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Every deploy records the commit it deployed, with or without migrations:
      # release-gate.sh measures the next release from .prod.last_sha (ADR-094
      # amendment 2026-10-24), and a field that moved only on migration releases
      # would make every later docs-only change deploy.
      - name: Update tracking files
        run: |
          bash scripts/update-tracking.sh prod \
            "${{ github.sha }}" \
            "${{ needs.build.outputs.schema_fingerprint }}" \
            '${{ steps.check.outputs.new_migrations }}'

      - name: Commit tracking update
        # See the matching comment on deploy-cert's "Commit tracking update"
        # -- same retry-and-regenerate fix, same race it closes.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            bash scripts/update-tracking.sh prod \
              "${{ github.sha }}" \
              "${{ needs.build.outputs.schema_fingerprint }}" \
              '${{ steps.check.outputs.new_migrations }}'
            git add deployed_migrations.json release-manifest.json
            git commit -m "chore: update PROD tracking [skip ci]"
            if git push; then
              echo "Pushed on attempt $attempt"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Failed to push PROD tracking update after 5 attempts" >&2
              exit 1
            fi
            echo "Push rejected (race with a concurrent release run) -- refetching and retrying ($attempt/5)"
            sleep $(( (RANDOM % 5) + 1 ))
            git fetch origin main
            git reset --hard origin/main
          done

      # Every failure but the posture check's, which has its own message above:
      # migrations, fingerprint, Edge Function or the tracking push (WFALERT.01).
      - name: Notify deploy failure (PROD)
        if: failure() && steps.posture.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Release: PROD deploy FAILED. Check: ${RUN_URL}" > /dev/null
