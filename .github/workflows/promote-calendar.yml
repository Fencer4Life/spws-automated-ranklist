name: Promote calendar → PROD (reusable)

# The ONE CERT→PROD calendar mirror. Every sync that writes tbl_event on CERT
# -- evf-sync, pzsz-sync, and any future organizer sync (FIE, ...) -- calls
# this reusable workflow with `uses:` right after it finishes writing CERT, so
# a value that sync lands on CERT (a fee, an address, a date) reaches PROD in
# the same run instead of waiting for another workflow's cron. Before this file
# the job below was copy-pasted into each sync; a fourth copy would be a fourth
# place for the fragile prod-write/queue:max block to drift out of step.
#
# Scope: the CALENDAR only (tbl_event via fn_mirror_events_to_prod). Start lists
# (tbl_pzsz_start_list) reach PROD by hash replay in promote_event (ADR-108/112),
# not here -- pzsz-start-lists.yml does NOT call this workflow.
#
# The caller keeps its own `needs:` and `if:` (mode / dry_run gating lives on the
# calling job, which a reusable workflow cannot read), sets
# `permissions: { contents: write }` so the reconcile-log push works, passes a
# human `label` for the commit + Telegram text, and `secrets: inherit` to hand
# over SUPABASE_ACCESS_TOKEN, SUPABASE_CERT_REF, SUPABASE_PROD_REF,
# SUPABASE_CERT_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.

on:
  workflow_call:
    inputs:
      label:
        description: 'Human tag for the reconcile commit + failure alert (e.g. "EVF", "PZSz", "FIE")'
        type: string
        required: true

jobs:
  mirror:
    name: Promote calendar CERT → PROD
    runs-on: ubuntu-latest
    # contents: write so the reconcile run log can be committed back. Capped by
    # the caller's GITHUB_TOKEN, so the calling job must also grant it (ADR-083
    # least-privilege leaves pzsz-sync at contents: read by default).
    permissions:
      contents: write
    # Serialise with every other prod-write member (promote.yml, promote-season,
    # event-close, the parity sweep, and the other syncs' mirror calls). The
    # group is repo-global by name, so centralising it here keeps the guarantee
    # the three old copies each carried.
    concurrency:
      group: prod-write
      cancel-in-progress: false
      # queue: max on EVERY member of prod-write. The setting is per-job and
      # GitHub queues only ONE pending job per group, cancelling the pending one
      # when a new job arrives -- so a member without it can silently cancel a
      # sibling's pending promote. Defining the mirror once removes the risk of
      # one copy losing this line.
      queue: max
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # supabase-py uploads the run-report to the CERT staging-reports bucket
      # (best-effort; the repo copy under doc/staging/reconcile always writes).
      - name: Install dependencies
        run: pip install httpx supabase

      - name: Promote calendar CERT → PROD
        run: python -m python.pipeline.promote --mode calendar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CERT_REF: ${{ secrets.SUPABASE_CERT_REF }}
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
          SUPABASE_CERT_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_CERT_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Commit the human-readable reconcile run log
      # (doc/staging/reconcile/{season}.{ts}Z.md). [skip ci] so it doesn't
      # re-trigger CI.
      # The label reaches the scripts only through env (WFINJ.01).
      - name: Commit reconcile run log
        if: success()
        env:
          LABEL: ${{ inputs.label }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doc/staging/reconcile/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No reconcile report to commit"
          else
            git commit -m "chore: CERT→PROD reconcile run log (${LABEL}) [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt) -- fetching and rebasing"
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" = "5" ]; then
                echo "::error::git push failed after 5 attempts"
                exit 1
              fi
            done
          fi

      - name: Notify failure
        if: failure()
        env:
          LABEL: ${{ inputs.label }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${LABEL} calendar promote FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
