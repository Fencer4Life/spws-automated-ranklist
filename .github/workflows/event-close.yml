name: Daily Event Close

# ADR-108 §7 (decision P4b A): the last promote of an event usually runs on
# its final day, before the end date has passed, so the event stays
# IN_PROGRESS. Every morning this completes, on CERT and then on PROD, each
# event of the active season, of every organizer (ADR-113), still IN_PROGRESS whose end date has
# passed, once every listing is final, the organiser has published nothing new
# since the CERT run, and both environments hold that run's result. Otherwise it
# changes nothing and says on Telegram what to do. Idempotent; a failure alerts.
on:
  schedule:
    # 04:17 UTC is 05:17 or 06:17 in Warsaw: the day after an event ends.
    - cron: '17 4 * * *'   # off the hour: GitHub delays runs at the start of an hour (WFCRON.01)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, write nothing'
        type: boolean
        default: true

permissions:
  contents: read

# A PROD write: serialised with promote and the other prod-write members.
concurrency:
  group: prod-write
  cancel-in-progress: false
  # queue: max on EVERY member of prod-write. Enforced and explained by python/tests/test_workflow_lanes.py (WFLANE.01).
  queue: max

jobs:
  close:
    name: Close finished events
    runs-on: ubuntu-24.04
    outputs:
      # S3 A (4 Nov 2026): the past-season pass completed something on PROD.
      prod_completed: ${{ steps.close.outputs.prod_completed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx rapidfuzz beautifulsoup4 pyyaml

      - name: Close events
        id: close
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FTL_USERNAME: ${{ secrets.FTL_USERNAME }}
          FTL_READS: ${{ vars.FTL_READS }}
          FTL_PASSWORD: ${{ secrets.FTL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # A scheduled run writes; a manual run writes only when dry_run is unticked.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m python.pipeline.promotion.close --dry-run
          else
            python -m python.pipeline.promotion.close
          fi

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Daily event close FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # S3 A (doc/plans/past-season-close-when-2026-11-04.html): CI and LOCAL load
  # PROD's committed seed, and pgTAP 128 reads it. When the past-season pass
  # completed events on PROD, the seed is exported the same morning, so the
  # invariant reads what PROD holds. The close has committed; a failed export
  # alerts but does not undo it.
  seed:
    name: Export PROD seed (ADR-036)
    needs: close
    if: always() && needs.close.outputs.prod_completed == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Export PROD seed
        run: python -m python.pipeline.export_seed --ref "${{ secrets.SUPABASE_PROD_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Commit seed file (rebase and retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/seed_prod_*.sql supabase/seed_prod_latest.sql
          if git diff --cached --quiet; then
            echo "No seed changes to commit"
            exit 0
          fi
          git commit -m "chore: auto-export seed from PROD after the daily close completed past-season events [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          MSG="Seed export after the daily close FAILED (the close itself committed). Check: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
