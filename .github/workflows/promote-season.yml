name: Promote Season Skeleton to PROD

# ADR-077 §5/§7 — promote a CHILDLESS season skeleton (calendar only) CERT → PROD,
# then export the PROD seed (ADR-036). Dispatched from SeasonManager via the
# dispatch-workflow Edge Function (ADR-041) — no PROD creds in the browser.

on:
  workflow_dispatch:
    inputs:
      season_code:
        description: 'Season code (e.g. SPWS-2026-2027)'
        required: true
      action:
        description: 'promote (CERT→PROD) or delete (remove from target)'
        required: false
        default: 'promote'
      target:
        description: 'delete target env: PROD or CERT'
        required: false
        default: 'PROD'
      force_late_bootstrap:
        description: 'Skip the childless check (late-bootstrap a season onto PROD after CERT has real tournament children -- events are never part of this payload, see promote_season.py)'
        type: boolean
        default: false

permissions:
  contents: write

# Serialise PROD writes with every other prod-write member: promote.yml,
# promote-calendar.yml (the syncs' mirror), event-close.yml, evf-parity-sweep.yml
# and recompute-drain-prod.yml.
concurrency:
  group: prod-write
  cancel-in-progress: false
  # queue: max on EVERY member of prod-write. GitHub queues only ONE pending run
  # per group, cancelling the pending one when a new one arrives -- so a member
  # without it can silently cancel a sibling's pending promote. Cancelled is not
  # failed, so nothing alerts. Enforced and explained by python/tests/test_workflow_lanes.py (WFLANE.01).
  queue: max

jobs:
  promote-season:
    name: Season skeleton CERT → PROD
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Promote / delete season skeleton
        # Inputs are passed via env (never interpolated into the shell) to avoid
        # command injection; promote_season.py validates the season code shape.
        run: |
          FORCE_FLAG=""
          if [ "$SEASON_FORCE_LATE_BOOTSTRAP" = "true" ]; then
            FORCE_FLAG="--force-late-bootstrap"
          fi
          python -m python.pipeline.promote_season \
            --season "$SEASON_CODE" \
            --action "$SEASON_ACTION" \
            --target "$SEASON_TARGET" \
            $FORCE_FLAG
        env:
          SEASON_CODE: ${{ github.event.inputs.season_code }}
          SEASON_ACTION: ${{ github.event.inputs.action || 'promote' }}
          SEASON_TARGET: ${{ github.event.inputs.target || 'PROD' }}
          SEASON_FORCE_LATE_BOOTSTRAP: ${{ github.event.inputs.force_late_bootstrap || 'false' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CERT_REF: ${{ secrets.SUPABASE_CERT_REF }}
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Export PROD seed (ADR-036)
        if: success()
        run: python -m python.pipeline.export_seed --ref "${{ secrets.SUPABASE_PROD_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Commit seed file
        if: success()
        env:
          SEASON_CODE: ${{ github.event.inputs.season_code }}
          SEASON_ACTION: ${{ github.event.inputs.action || 'promote' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/seed_prod_*.sql supabase/seed_prod_latest.sql
          if git diff --cached --quiet; then
            echo "No seed changes to commit"
            exit 0
          fi
          git commit -m "chore: auto-export seed from PROD after season $SEASON_ACTION $SEASON_CODE [skip ci]"
          # A commit landing on main while this ran rejects the push: rebase onto it
          # and retry, as promote.yml does (test_workflow_alerts.py WFPUSH.01).
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      # The last step, so it sees every step before it (test_workflow_alerts.py
      # WFALERT.01). The failed step tells whether PROD changed: the seed export
      # and its commit run only after the promote or delete succeeded.
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEASON_CODE: ${{ github.event.inputs.season_code }}
          SEASON_ACTION: ${{ github.event.inputs.action || 'promote' }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Season skeleton ${SEASON_ACTION} ${SEASON_CODE} FAILED. Check: ${RUN_URL}" > /dev/null
