name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ADR-083: least-privilege GITHUB_TOKEN. Default repo scope is far wider than
# any job here needs; an injected step should not inherit write access.
permissions:
  contents: read   # checkout only; all DB writes use SUPABASE_* service-role secrets

jobs:
  test-db:
    name: pgTAP (database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # Was 2.84.2, pinned on 2026-04-20 because v2.90.0 dropped connections
          # in the pgTAP auth tests (4b6d359). release.yml now pins 2.116.0
          # (6427ec7), verified green through a full CERT+PROD deploy, so the two
          # workflows were validating against different CLI versions. This run is
          # the test of whether the 2.90.0 regression still exists: if the pgTAP
          # auth tests drop connections again, revert to 2.84.2 and record HERE
          # that the divergence is deliberate, so nobody "aligns" it a third time.
          version: 2.116.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

  test-python:
    name: pytest (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Ruff baseline is clean (lint + format) — these steps now ENFORCE (block CI).
      - name: Ruff lint
        run: ruff check python/ scripts/render_adrs.py scripts/render_docs.py scripts/check_docs.py scripts/build_doc_inventory.py

      - name: Ruff format check
        run: ruff format --check python/ scripts/render_adrs.py scripts/render_docs.py scripts/check_docs.py scripts/build_doc_inventory.py

      # basedpyright baseline is clean — enforces (blocks CI), same as ruff above.
      - name: basedpyright type-check
        run: basedpyright python/ scripts/render_adrs.py scripts/render_docs.py scripts/check_docs.py scripts/build_doc_inventory.py

      - name: Validate generated ADR HTML
        run: python scripts/render_adrs.py --check

      - name: Validate generated Docs HTML
        run: python scripts/render_docs.py --check

      - name: Validate current documentation
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_docs.py --changed-from "$DOC_BASE"

      - name: Run pytest
        run: pytest

  test-frontend:
    name: Vitest (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm test

  coherence:
    name: Coherence Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run coherence checks
        run: bash scripts/check-coherence.sh
