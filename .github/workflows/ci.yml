name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ADR-083: least-privilege GITHUB_TOKEN. Default repo scope is far wider than
# any job here needs; an injected step should not inherit write access.
permissions:
  contents: read   # checkout only; all DB writes use SUPABASE_* service-role secrets

jobs:
  test-db:
    name: pgTAP (database)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # v3 is a composite action and needs no Node runtime; v1 targeted the
      # deprecated Node.js 20 (WFSETUP.01). The CLI version below is separate.
      - uses: supabase/setup-cli@v3
        with:
          # PINNED ON PURPOSE — read this before changing it.
          #
          # This was 2.84.2 from 2026-04-20 (4b6d359) because v2.90.0 dropped
          # connections in the pgTAP auth tests. That reason lived only in a
          # commit message, so the pin looked like drift and was "tidied up"
          # twice: 6d4416e (Aug, reverted 5 minutes later, no reason recorded)
          # and again in Sep. Hence this comment.
          #
          # 2.116.0 was verified on PR #15 (2026-09-06): pgTAP green, so the
          # v2.90.0 regression is gone, and it matches release.yml (6427ec7),
          # which was itself proven through a full build + CERT + PROD run.
          #
          # config.toml has no image-pinning knob (only major_version = 17), so
          # THIS VERSION is what decides which Postgres/gotrue/kong images boot.
          # A bump is a stack change: test it on a PR, never straight on main.
          # LOCAL runs it too: preflight fails on any other local CLI
          # (scripts/check_supabase_cli.py, WFSETUP.03).
          version: 2.116.0

      - name: Start Supabase local stack
        run: supabase start

      # The version comes from the config's $schema pin, so CI and LOCAL run the
      # same checker; scripts/check-postgrestools.sh refuses any other version.
      - name: Install postgrestools
        run: npm install -g "@postgrestools/postgrestools@$(sed -n 's#.*pg-language-server\.com/\([0-9.]*\)/schema\.json.*#\1#p' postgres-language-server.jsonc)"

      # Zero findings over every pgTAP file and every migration after the
      # config's cut-off, warnings included, with positive controls proving
      # type checking, plpgsql_check and pgTAP resolution ran (GATE.02–03).
      # pgTAP and plpgsql_check come from supabase/seed_dev_tooling.sql,
      # loaded by `supabase start`.
      - name: postgrestools (hard gate)
        id: postgrestools
        run: bash scripts/check-postgrestools.sh

      # Kept with tee for the run's Summary page; shell: bash adds pipefail, so a
      # failing test still fails the step (WFPIPE.01).
      - name: Run pgTAP tests
        shell: bash
        run: supabase test db 2>&1 | tee pgtap.out

      # pg_prove calls a file ok that ran a different number of assertions than it
      # planned; this fails it (CISUM.08, plan F1 A). Preflight runs the same check.
      - name: Every pgTAP file ran its plan
        id: pgtap_plans
        run: python3 scripts/check_pgtap_plans.py pgtap.out

      # The job's section of the run's Summary page: each check, the counts, and
      # each failing file with its failed tests (NFR-17, CISUM.06). Plan
      # doc/plans/ci-test-summaries-2026-11-01.html.
      - name: Write the pgTAP section of the run summary
        if: always()
        env:
          POSTGRESTOOLS: ${{ steps.postgrestools.outcome }}
          PGTAP_PLANS: ${{ steps.pgtap_plans.outcome }}
        run: python3 scripts/ci_summary.py --title "pgTAP (database)" --check "postgrestools=$POSTGRESTOOLS" --check "Every file ran its plan=$PGTAP_PLANS" --tap pgtap.out >> "$GITHUB_STEP_SUMMARY"

  test-python:
    name: pytest (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Ruff baseline is clean (lint + format) — these steps now ENFORCE (block CI).
      - name: Ruff lint
        id: ruff
        run: ruff check python/ scripts/ tools/

      - name: Ruff format check
        id: ruff_format
        run: ruff format --check python/ scripts/ tools/

      # basedpyright baseline is clean — enforces (blocks CI), same as ruff above.
      - name: basedpyright type-check
        id: basedpyright
        run: basedpyright python/ scripts/ tools/

      - name: Validate generated ADR HTML
        id: adr_pages
        run: python scripts/render_adrs.py --check

      - name: Validate generated Docs HTML
        id: doc_pages
        run: python scripts/render_docs.py --check

      - name: Validate generated handbook page frame
        id: handbook_frame
        run: python scripts/render_handbook_frame.py --check

      - name: Validate current documentation
        id: check_docs
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_docs.py --changed-from "$DOC_BASE"

      # The JUnit file is what the run's Summary page reads (NFR-17).
      - name: Run pytest
        run: pytest --junitxml=pytest.xml

      # The job's section of the run's Summary page: each check as a pass or fail
      # line, the counts, and each failing test with its first error line (CISUM.06).
      - name: Write the pytest section of the run summary
        if: always()
        env:
          RUFF: ${{ steps.ruff.outcome }}
          RUFF_FORMAT: ${{ steps.ruff_format.outcome }}
          BASEDPYRIGHT: ${{ steps.basedpyright.outcome }}
          ADR_PAGES: ${{ steps.adr_pages.outcome }}
          DOC_PAGES: ${{ steps.doc_pages.outcome }}
          HANDBOOK_FRAME: ${{ steps.handbook_frame.outcome }}
          CHECK_DOCS: ${{ steps.check_docs.outcome }}
        run: |
          python3 scripts/ci_summary.py --title "pytest (Python)" \
            --check "Ruff=$RUFF" --check "Ruff format=$RUFF_FORMAT" --check "BasedPyright=$BASEDPYRIGHT" \
            --check "ADR pages=$ADR_PAGES" --check "Rendered docs=$DOC_PAGES" \
            --check "Handbook frame=$HANDBOOK_FRAME" --check "check_docs=$CHECK_DOCS" \
            --junit pytest.xml >> "$GITHUB_STEP_SUMMARY"

  # G43 A: every identity entry of doc/overrides/*.yaml names exactly one fencer
  # on CERT's roster (PROD's master data), read only; preflight runs the same gate
  # against LOCAL. Its own job, so only it holds the token. A line names the file
  # and the entry, never a fencer or a birth year (D12). The last step writes the
  # job's summary section and, unless the gate passed, tells Telegram (CISUM.06,
  # WFALERT.01).
  override-drift:
    name: Override files (CERT roster)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx pyyaml rapidfuzz

      - name: Override files name the roster
        id: override_drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python -m python.pipeline.override_drift --roster cert

      - name: Write the run summary, and tell Telegram unless the gate passed
        if: always()
        env:
          OVERRIDE_DRIFT: ${{ steps.override_drift.outcome }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          python3 scripts/ci_summary.py --title "Override files (CERT roster)" \
            --check "Override files=$OVERRIDE_DRIFT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$OVERRIDE_DRIFT" == "success" ]]; then
            exit 0
          elif [[ "$OVERRIDE_DRIFT" == "failure" ]]; then
            MSG="❌ CI: an override file no longer names exactly one roster fencer (G43); the run lists the file and the entry. Check: ${RUN_URL}"
          else
            MSG="❌ CI: the override-file check did not run (${OVERRIDE_DRIFT}). Check: ${RUN_URL}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

  test-frontend:
    name: Vitest (frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Node 24, the LTS line; Node 20 reached its end of life in April 2026 (WFNODE.01).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Same gate as scripts/preflight.sh (GATE.06): svelte-check exits 0 on
      # warnings unless told otherwise.
      - name: svelte-check (warnings fail)
        id: svelte_check
        working-directory: frontend
        run: npm run check -- --fail-on-warnings

      # Vitest writes its own section of the run's Summary page: its github-actions
      # reporter, pinned in frontend/vite.config.ts (CISUM.07).
      - name: Run Vitest
        id: vitest
        working-directory: frontend
        run: npm test

      # The job's own lines beside Vitest's summary (CISUM.06).
      - name: Write the frontend section of the run summary
        if: always()
        env:
          SVELTE_CHECK: ${{ steps.svelte_check.outcome }}
          VITEST: ${{ steps.vitest.outcome }}
        run: python3 scripts/ci_summary.py --title "Vitest (frontend)" --check "svelte-check=$SVELTE_CHECK" --check "Vitest=$VITEST" >> "$GITHUB_STEP_SUMMARY"

  coherence:
    name: Coherence Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run coherence checks
        env:
          # The range this pull request or push brings, which gate 4 checks: on a
          # push to main, origin/main is the pushed commit itself, so without it the
          # gate compared a commit with itself (test_coherence_migration_gate.py).
          COHERENCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Kept with tee for the run's Summary page; shell: bash adds pipefail (WFPIPE.01).
        shell: bash
        run: bash scripts/check-coherence.sh 2>&1 | tee coherence.out

      # Each gate's PASS or FAIL line, as the script printed it (CISUM.06).
      - name: Write the coherence section of the run summary
        if: always()
        run: python3 scripts/ci_summary.py --title "Coherence Checks" --gates coherence.out >> "$GITHUB_STEP_SUMMARY"
