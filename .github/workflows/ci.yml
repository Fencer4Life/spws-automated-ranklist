name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ADR-083: least-privilege GITHUB_TOKEN. Default repo scope is far wider than
# any job here needs; an injected step should not inherit write access.
permissions:
  contents: read   # checkout only; all DB writes use SUPABASE_* service-role secrets

jobs:
  test-db:
    name: pgTAP (database)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # v3 is a composite action and needs no Node runtime; v1 targeted the
      # deprecated Node.js 20 (WFSETUP.01). The CLI version below is separate.
      - uses: supabase/setup-cli@v3
        with:
          # PINNED ON PURPOSE — read this before changing it.
          #
          # This was 2.84.2 from 2026-04-20 (4b6d359) because v2.90.0 dropped
          # connections in the pgTAP auth tests. That reason lived only in a
          # commit message, so the pin looked like drift and was "tidied up"
          # twice: 6d4416e (Aug, reverted 5 minutes later, no reason recorded)
          # and again in Sep. Hence this comment.
          #
          # 2.116.0 was verified on PR #15 (2026-09-06): pgTAP green, so the
          # v2.90.0 regression is gone, and it matches release.yml (6427ec7),
          # which was itself proven through a full build + CERT + PROD run.
          #
          # config.toml has no image-pinning knob (only major_version = 17), so
          # THIS VERSION is what decides which Postgres/gotrue/kong images boot.
          # A bump is a stack change: test it on a PR, never straight on main.
          version: 2.116.0

      - name: Start Supabase local stack
        run: supabase start

      # The version comes from the config's $schema pin, so CI and LOCAL run the
      # same checker; scripts/check-postgrestools.sh refuses any other version.
      - name: Install postgrestools
        run: npm install -g "@postgrestools/postgrestools@$(sed -n 's#.*pg-language-server\.com/\([0-9.]*\)/schema\.json.*#\1#p' postgres-language-server.jsonc)"

      # Zero findings over every pgTAP file and every migration after the
      # config's cut-off, warnings included, with positive controls proving
      # type checking, plpgsql_check and pgTAP resolution ran (GATE.02–03).
      # pgTAP and plpgsql_check come from supabase/seed_dev_tooling.sql,
      # loaded by `supabase start`.
      - name: postgrestools (hard gate)
        run: bash scripts/check-postgrestools.sh

      - name: Run pgTAP tests
        run: supabase test db

  test-python:
    name: pytest (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Ruff baseline is clean (lint + format) — these steps now ENFORCE (block CI).
      - name: Ruff lint
        run: ruff check python/ scripts/ tools/

      - name: Ruff format check
        run: ruff format --check python/ scripts/ tools/

      # basedpyright baseline is clean — enforces (blocks CI), same as ruff above.
      - name: basedpyright type-check
        run: basedpyright python/ scripts/ tools/

      - name: Validate generated ADR HTML
        run: python scripts/render_adrs.py --check

      - name: Validate generated Docs HTML
        run: python scripts/render_docs.py --check

      - name: Validate generated handbook page frame
        run: python scripts/render_handbook_frame.py --check

      - name: Validate current documentation
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_docs.py --changed-from "$DOC_BASE"

      - name: Run pytest
        run: pytest

  test-frontend:
    name: Vitest (frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Node 24, the LTS line; Node 20 reached its end of life in April 2026 (WFNODE.01).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Same gate as scripts/preflight.sh (GATE.06): svelte-check exits 0 on
      # warnings unless told otherwise.
      - name: svelte-check (warnings fail)
        working-directory: frontend
        run: npm run check -- --fail-on-warnings

      - name: Run Vitest
        working-directory: frontend
        run: npm test

  coherence:
    name: Coherence Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run coherence checks
        env:
          # The range this pull request or push brings, which gate 4 checks: on a
          # push to main, origin/main is the pushed commit itself, so without it the
          # gate compared a commit with itself (test_coherence_migration_gate.py).
          COHERENCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-coherence.sh
