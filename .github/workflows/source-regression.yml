name: Source re-read

# ADR-119 G45 A (doc/plans/partial-ingest-promote-results-sync-2026-10-31.html,
# the push 2b build sheet, 2b.7–2b.10). Every international event of the last
# 30 months is read and planned against CERT, nothing written, and compared with
# CERT's stored rows and PROD's result fingerprint; it runs on Mondays, the day
# before an international event starts, and whenever it is started by hand.
# Every day it names the international events starting within 14 days and
# dry-reads, through results-sync.yml, those with a results link (G42 A (2)).
# One Telegram line; the named detail goes to CERT's staging-reports bucket,
# never to this log (D12). Read only on CERT and PROD.
run-name: "Source re-read · ${{ github.event_name == 'schedule' && 'daily' || 'manual' }}"

on:
  schedule:
    # 05:17 UTC: 06:17 or 07:17 in Warsaw. A late start lands the same day,
    # which is all a daily check needs (G47 is about the hourly cycles).
    - cron: '17 5 * * *'   # off the hour: GitHub delays runs at the start of an hour (WFCRON.01)
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # to start results-sync.yml's dry runs

jobs:
  reread:
    name: Re-read the international sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase httpx rapidfuzz beautifulsoup4 pyyaml

      - name: Re-read
        id: reread
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # read_event and plan_event read CERT through this connector and write nothing.
          SUPABASE_URL: ${{ secrets.SUPABASE_CERT_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_CERT_SERVICE_ROLE_KEY }}
          FTL_USERNAME: ${{ secrets.FTL_USERNAME }}
          FTL_PASSWORD: ${{ secrets.FTL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m python.pipeline.source_regression $([ "$MANUAL" = "true" ] && echo --manual)

      - name: Dry-read the upcoming events
        if: steps.reread.outputs.dry_read != '' && steps.reread.outputs.dry_read != '[]'
        env:
          CODES: ${{ steps.reread.outputs.dry_read }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for code in $(echo "$CODES" | jq -r '.[]'); do
            gh workflow run results-sync.yml -f event_code="$code" -f dry_run=true
            echo "results-sync.yml dry run started for $code"
          done

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Source re-read FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
